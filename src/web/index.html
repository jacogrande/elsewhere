<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elsewhere</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23c2410c'/><circle cx='16' cy='16' r='5' fill='white'/></svg>" />
    <script>
      // Sets the colour mode before first paint so there's no flash.
      // Mirrors parseModePreference + resolveMode in src/web/lib/color-mode.ts.
      (() => {
        var pref = null;
        try {
          pref = localStorage.getItem("elsewhere.mode");
        } catch {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
